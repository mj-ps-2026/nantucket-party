<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foam Party & Pig Roast — Flyer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --sky: #4cb7e8;
      --sky-deep: #2c97d4;
      --grass: #6fbe45;
      --grass-deep: #4e9e2c;
      --tomato: #ff5440;
      --sunny: #ffc526;
      --pink: #ff5ba0;
      --teal: #1fc3b6;
      --cream: #fffaef;
      --ink: #2e2016;
      --ink-soft: #6a5742;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    /* ── Page setup ── */
    @page {
      size: 8.5in 11in;
      margin: 0;
    }

    .page {
      width: 8.5in;
      height: 11in;
      position: relative;
      overflow: hidden;
      page-break-after: always;
    }

    /* ── FRONT: full-bleed hero ── */
    .front {
      background: var(--ink);
    }
    .front img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* ── BACK: party info ── */
    .back {
      background: linear-gradient(
        180deg,
        var(--sky) 0%,
        #7fd0ee 34%,
        #b6e6c2 52%,
        var(--grass) 78%,
        var(--grass-deep) 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 0.6in 0.75in;
    }

    /* sunbeam */
    .back::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(900px 600px at 88% -8%, rgba(255,224,130,0.55), transparent 60%),
        radial-gradient(700px 500px at 6% 4%, rgba(255,255,255,0.28), transparent 60%);
      pointer-events: none;
    }

    .back-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 100%;
      max-width: 6.4in;
    }

    /* ── kicker pill ── */
    .kicker {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 13pt;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--tomato);
      background: white;
      border-radius: 999px;
      padding: 5pt 22pt;
      border: 3px solid var(--tomato);
      margin-bottom: 22pt;
    }

    /* ── main title ── */
    .title {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 72pt;
      line-height: 0.95;
      text-align: center;
      color: var(--ink);
      text-shadow: 0 6px 0 rgba(46,32,22,0.12);
      margin-bottom: 28pt;
    }
    .title .amp {
      color: var(--tomato);
    }
    .title .pig {
      color: var(--grass-deep);
    }

    /* ── sticker card ── */
    .card {
      background: var(--cream);
      border: 4px solid var(--ink);
      border-radius: 28px;
      padding: 32pt 48pt;
      width: 100%;
      box-shadow: 0 10px 0 -3px rgba(46,32,22,0.12), 0 20px 40px -12px rgba(46,32,22,0.32);
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 24pt;
    }

    .detail-row {
      display: flex;
      align-items: baseline;
      gap: 16pt;
      padding: 11pt 0;
      border-bottom: 2px dashed rgba(46,32,22,0.15);
    }
    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-icon {
      font-size: 24pt;
      flex-shrink: 0;
      width: 36pt;
      text-align: center;
    }

    .detail-label {
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 11pt;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      width: 72pt;
      flex-shrink: 0;
    }

    .detail-value {
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 20pt;
      color: var(--ink);
      line-height: 1.2;
    }

    /* ── website badge ── */
    .website-row {
      display: flex;
      align-items: center;
      gap: 14pt;
      margin-bottom: 22pt;
    }

    .website-badge {
      background: var(--sky-deep);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-weight: 600;
      font-size: 22pt;
      border-radius: 16px;
      padding: 10pt 30pt;
      border: 3px solid var(--ink);
      box-shadow: 0 5px 0 rgba(46,32,22,0.18);
      letter-spacing: 0.04em;
    }

    /* ── CTA ── */
    .cta {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 44pt;
      color: var(--sunny);
      text-align: center;
      line-height: 1;
      text-shadow:
        0 3px 0 rgba(46,32,22,0.18),
        3px 0 0 rgba(46,32,22,0.1),
        0 0 0 4px var(--ink);
      -webkit-text-stroke: 3px var(--ink);
      paint-order: stroke fill;
    }

    /* ── tagline ── */
    .tagline {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 11pt;
      color: var(--ink);
      background: var(--sunny);
      border-radius: 8px;
      padding: 4pt 14pt;
      margin-top: 10pt;
      opacity: 0.85;
    }

    /* ── screen preview layout ── */
    @media screen {
      body {
        background: #888;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        padding: 32px;
      }
      .page {
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      }
    }
  </style>
</head>
<body>

  <!-- FRONT: hero image -->
  <div class="page front">
    <img src="public/hero-illustration.jpg" alt="Foam Party & Pig Roast">
  </div>

  <!-- BACK: party details -->
  <div class="page back">
    <div class="back-inner">

      <div class="kicker">You're invited 🎉</div>

      <h1 class="title">
        Foam Party<br>
        <span class="amp">&amp;</span> <span class="pig">Pig Roast</span>
      </h1>

      <div class="card">
        <div class="detail-row">
          <span class="detail-icon">📅</span>
          <span class="detail-label">When</span>
          <span class="detail-value">Saturday, June 27th at 1 PM</span>
        </div>
        <div class="detail-row">
          <span class="detail-icon">📍</span>
          <span class="detail-label">Where</span>
          <span class="detail-value">3040 Nantucket Dr</span>
        </div>
        <div class="detail-row">
          <span class="detail-icon">🫧</span>
          <span class="detail-label">Heads up</span>
          <span class="detail-value">Bring a towel. Leave your dignity at home.</span>
        </div>
      </div>

      <div class="website-row">
        <span class="website-badge">thenantucket.party</span>
      </div>

      <div class="cta">Come on by! 🐷</div>
      <div class="tagline">RSVP online — see who's going, leave a note</div>

    </div>
  </div>

</body>
</html>
